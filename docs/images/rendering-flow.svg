<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">cub3D · 렌더링 흐름</title><desc id="desc">cub 파일을 파싱하고 화면 버퍼를 준비한 뒤 각 화면 열의 Ray를 계산한다. DDA로 벽 충돌을 찾고 텍스처를 합성한 다음 Sprite를 Z-depth와 비교해 버퍼에 합성하고 MiniLibX로 출력한다.</desc>
