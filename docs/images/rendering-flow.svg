<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">cub3D · 렌더링 흐름</title><desc id="desc">cub 파일을 파싱한 뒤 화면 열마다 Ray를 계산하고 DDA로 벽을 찾는다. 벽 텍스처와 스프라이트를 깊이 기준으로 합성한 뒤 MiniLibX 이미지로 출력한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">cub3D · 렌더링 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">맵 입력 · Raycasting · Depth 처리 · 화면 출력</text>
<rect x="32" y="104" width="936" height="105" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="135" font-size="17" font-weight="700" fill="#4865a0">01  입력 준비</text>
<rect x="212" y="124" width="250" height="66" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="230" y="152" font-size="18" font-weight="700" fill="#163b76">.cub 파일 파싱</text><text x="230" y="177" font-size="15" fill="#263a54">맵 · 텍스처 · 색상 · 플레이어</text>
<rect x="510" y="124" width="250" height="66" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="528" y="152" font-size="18" font-weight="700" fill="#163b76">화면 버퍼 초기화</text><text x="528" y="177" font-size="15" fill="#263a54">게임 상태 · 이미지 버퍼</text>
<path d="M462 157 H500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="225" width="936" height="123" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="257" font-size="17" font-weight="700" fill="#4865a0">02  Raycasting</text>
<rect x="212" y="247" width="205" height="76" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="230" y="276" font-size="18" font-weight="700" fill="#163b76">Ray 방향 계산</text><text x="230" y="302" font-size="15" fill="#263a54">화면 열 단위</text>
<rect x="447" y="247" width="205" height="76" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="465" y="276" font-size="18" font-weight="700" fill="#163b76">DDA 벽 탐색</text><text x="465" y="302" font-size="15" fill="#263a54">충돌 격자 · 거리 계산</text>
<rect x="682" y="247" width="205" height="76" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="700" y="276" font-size="18" font-weight="700" fill="#163b76">벽 텍스처 합성</text><text x="700" y="302" font-size="15" fill="#263a54">천장 · 벽 · 바닥</text>
<path d="M417 285 H437" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M652 285 H672" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="364" width="936" height="78" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="396" font-size="17" font-weight="700" fill="#086b62">03  화면 합성</text>
<text x="215" y="397" font-size="18" font-weight="700" fill="#086b62">Sprite 거리 정렬 → Z-depth 비교 → Buffer 합성 → MiniLibX 출력</text>
<text x="215" y="423" font-size="15" fill="#263a54">키 입력으로 위치·시선을 갱신하고 다음 Frame을 다시 렌더링</text>
</g></svg>