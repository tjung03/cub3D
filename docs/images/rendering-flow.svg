<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">cub3D · Raycasting 흐름</title>
<desc id="desc">cub 파일에서 맵과 플레이어 상태를 읽고 화면 열마다 Ray 방향을 계산한다. DDA로 벽 충돌 격자를 찾은 뒤 수직 거리와 텍스처 좌표를 계산한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="390" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">cub3D · Raycasting 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Map Input · Ray Direction · DDA · Wall Distance</text>

<rect x="32" y="112" width="936" height="210" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>

<rect x="70" y="174" width="185" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="90" y="204" font-size="18" font-weight="700" fill="#163b76">.cub 파싱</text>
<text x="90" y="232" font-size="14" fill="#263a54">맵 · 플레이어 · 텍스처</text>

<rect x="300" y="174" width="185" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="320" y="204" font-size="18" font-weight="700" fill="#163b76">Ray 계산</text>
<text x="320" y="232" font-size="14" fill="#263a54">화면 열마다 방향 생성</text>

<rect x="530" y="174" width="185" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="550" y="204" font-size="18" font-weight="700" fill="#163b76">DDA 탐색</text>
<text x="550" y="232" font-size="14" fill="#263a54">벽 1 충돌 격자 탐색</text>

<rect x="760" y="174" width="170" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="780" y="204" font-size="18" font-weight="700" fill="#163b76">벽 계산</text>
<text x="780" y="232" font-size="14" fill="#263a54">거리 · 높이 · Texture</text>

<path d="M255 218 H290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M485 218 H520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M715 218 H750" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="32" y="342" width="936" height="26" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="360" font-size="13" fill="#475569">계산한 벽 깊이(z_depth)는 같은 화면 열에서 Sprite가 벽 앞에 있는지 판단할 때 다시 사용</text>
</g></svg>