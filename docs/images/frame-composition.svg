<path d="M495 199 H528" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M728 199 H761" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="72" y="323" font-size="14" fill="#475569">다음 main_loop에서 키 입력 상태를 위치·시선에 반영하고 새 Frame을 다시 계산</text>
</g></svg>