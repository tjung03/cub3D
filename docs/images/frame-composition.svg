<text x="32" y="74" font-size="16" fill="#4b5e78">Wall Depth · Sprite Projection · Color Buffer · MiniLibX</text>

<rect x="32" y="112" width="936" height="178" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>

<rect x="72" y="158" width="190" height="82" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="92" y="187" font-size="18" font-weight="700" fill="#086b62">Wall Buffer</text>
<text x="92" y="214" font-size="14" fill="#263a54">벽 · 천장 · 바닥 + z_depth</text>

<rect x="305" y="158" width="190" height="82" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="325" y="187" font-size="18" font-weight="700" fill="#086b62">Sprite 처리</text>
<text x="325" y="214" font-size="14" fill="#263a54">거리 정렬 · 깊이 비교</text>

<rect x="538" y="158" width="190" height="82" rx="10" fill="#fff" stroke="#cbd5e1"/>
